# Hyper-parameter search used in the paper (Appendix B.3, Table 7).
# Notation a:s:b = values from a to b with step s.  -1.0 disables a component family.

editing:
  # shared across all editing modes
  beta:  [0.05, 0.15, 0.25]            # utility-regularization strength (0 = target-only ablation)
  alpha: [0.70, 0.75, 0.80, 0.85, 0.90] # Elastic-Net sparsity
  pca_top_k: 16                         # principal directions for attention utility risk
  grids:
    codellama-7b:
      attention_only: {rho_attn: "0.10:0.05:0.60", rho_mlp: -1.0}
      mlp_only:       {rho_attn: -1.0,             rho_mlp: "0.10:0.05:0.80"}
      combined:       {rho_attn: "0.16:0.02:0.24", rho_mlp: "0.35:0.05:0.55"}
    qwen2.5-coder-3b:
      attention_only: {rho_attn: "0.10:0.05:0.60", rho_mlp: -1.0}
      mlp_only:       {rho_attn: -1.0,             rho_mlp: "0.10:0.05:0.80"}
      combined:       {rho_attn: "0.16:0.02:0.36", rho_mlp: "0.35:0.05:0.55"}

steering_baselines:
  # residual-stream steering (RSS) and component-level steering (CLS), Appendix B.2
  gamma: "0.0:0.1:2.0"

selection:
  # Appendix B.3: among configurations that retain at least 90% of the base model's
  # validation pass@1, pick the lowest vulnerability ratio; break ties by higher pass@1.
  min_relative_pass1: 0.90
  primary: vulnerability_ratio   # minimize
  tie_breaker: pass1             # maximize

decoding:
  strategy: greedy
  max_new_tokens_security: 2048   # ProSec / CyberSecEval
  max_new_tokens_utility: 512     # HumanEval-Multi / MXEval
  seed: 20
